name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Vaadin Charts needs a license for production builds. Pull requests from forks
      # get no secrets, so without the key the build falls back to a watermarked build.
      - name: Build and test
        env:
          VAADIN_OFFLINE_KEY: ${{ secrets.VAADIN_OFFLINE_KEY }}
        run: |
          if [ -n "$VAADIN_OFFLINE_KEY" ]; then
            ./mvnw -B -ntp verify
          else
            echo "::notice::No Vaadin license key available, building with a watermark"
            ./mvnw -B -ntp -Dvaadin.commercialWithBanner verify
          fi
